{% extends "base.html" %}

{% block title %}{{ 'Edit User' if user else 'Create User' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">{{ 'Edit User' if user else 'Create New User' }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" value="{{ user.username if user else '' }}" {% if user %}disabled{% endif %} required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email if user else '' }}" {% if user %}disabled{% endif %} required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" value="{{ user.full_name if user else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select" required>
                            <option value="">Select Role</option>
                            <option value="receptionist" {% if user and user.role == 'receptionist' %}selected{% endif %}>Receptionist</option>
                            <option value="dept_user" {% if user and user.role == 'dept_user' %}selected{% endif %}>Department User</option>
                            <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Admin</option>
                            <option value="superadmin" {% if user and user.role == 'superadmin' %}selected{% endif %}>Superadmin</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department (Optional)</label>
                        <select name="department_id" class="form-select">
                            <option value="">None</option>
                            {% for dept in departments %}
                            <option value="{{ dept.department_id }}" {% if user and user.department_id == dept.department_id %}selected{% endif %}>
                                {{ dept.department_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">{{ 'New Password (leave blank to keep current)' if user else 'Password' }}</label>
                        <input type="password" name="password" class="form-control" {% if not user %}required{% endif %}>
                    </div>

                    <button type="submit" class="btn btn-primary">{{ 'Update User' if user else 'Create User' }}</button>
                    <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
