databases:
  - name: doctrack-db
    plan: free
    databaseName: doctrack

services:
  - type: web
    name: doctrack
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doctrack-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SLA_HOURS
        value: "48"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.75"
